[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woa-awe-oo"
version = "0.2.0"
description = "Local-first assistant with a from-scratch trainable language model"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
train = ["torch>=2.6"]

[project.scripts]
woa = "woa.cli:main"

[tool.setuptools.packages.find]
include = ["woa*"]

[tool.setuptools.package-data]
woa = ["web/*.html"]
